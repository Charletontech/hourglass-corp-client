<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style/admin.css" />
    <script defer src="js/admin-dashboard.js"></script>
  </head>
  <body>
    <div class="dashboard-container">
      <nav>
        <ul>
          <li><a href="#requestTable">Requests</a></li>
          <li><a href="#agents">Agents</a></li>
          <li><a href="/login.htm">Log Out</a></li>
        </ul>
      </nav>
      <h1>Admin Dashboard</h1>
      <button id="logoutButton" class="updateBalanceButton">
        Log Out Admin
      </button>
      <button id="updateBalanceButton" class="updateBalanceButton">
        Update Agent Balance
      </button>
      <h2>All Request</h2>
      <table id="requestTable" border="1">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Category</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be dynamically populated here -->
        </tbody>
      </table>

      <h2>All Agents</h2>
      <table id="agents" border="1">
        <thead>
          <tr>
            <th>Agent ID</th>
            <th>Agent Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Balance</th>
            <th>Address</th>
            <th>LGA</th>
            <th>State of Origin</th>
            <th>Business Name</th>
            <!-- <th>Actions</th> -->
          </tr>
        </thead>
        <tbody id="agentsTableBody">
          <!-- Rows will be dynamically populated here -->
        </tbody>
      </table>
    </div>
  </body>
</html>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/admin-dashboard.js"></script>
